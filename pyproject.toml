[project]
name = "agentic-3d-asset-factory"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
